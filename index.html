<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flash CS4 Workspace</title>
<style>
:root{
  --font:"Lucida Grande","Lucida Sans Unicode","Helvetica Neue",Helvetica,Arial,sans-serif;
  --menubar-top:#f4f4f4; --menubar-bot:#d6d6d6;
  --frame:#6b6b6b;            /* outer frame tone sampled from MMPG 1041 */
  --edge:#666666;             /* tab edge colour from MMPG 1068/1069 */
  --panel:#e8e8e8;            /* panel body (MMPG 1041/1045 interior) */
  --panel-hi:#f0f0f0;
  --panel-lo:#b8b8b8;         /* bevel shadow from MMPG 1045 */
  --tabstrip:#b4b4b4;
  --tab-off:#c9c9c9;
  --text:#1e1e1e; --text-dim:#6e6e6e; --text-off:#a3a3a3;
  --hot:#0b4fd1;              /* dvaui hot-text blue */
  --sel:#3875d7; --sel-text:#fff;
  --pasteboard:#d9d9d9; --stage:#ffffff;
  --tl-frame:#ffffff; --tl-frame5:#ebebeb; --tl-grid:#d4d4d4; --tl-playhead:#cc0000;
  --layer-sel:#3d5a99;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font:11px/1.25 var(--font);color:var(--text);background:#8a8a8a;user-select:none;-webkit-user-select:none}
img{display:block;image-rendering:auto}
button{font:inherit;color:inherit}

/* ---------- Mac menu bar (MBAR 2 / MENU 269-279) ---------- */
#menubar{height:22px;display:flex;align-items:stretch;background:linear-gradient(var(--menubar-top),var(--menubar-bot));border-bottom:1px solid #8c8c8c;position:relative;z-index:50;font-size:14px;padding-left:10px}
#menubar .mt{padding:0 9px;display:flex;align-items:center;cursor:default;white-space:nowrap}
#menubar .mt.app{font-weight:bold}
#menubar .mt.apple{font-size:16px;padding:0 12px 0 6px}
#menubar .mt.open{background:var(--sel);color:#fff}
#menubar .right{margin-left:auto;display:flex;align-items:center;gap:14px;padding-right:12px;font-size:13px}
.menu{position:fixed;background:rgba(246,246,246,.98);border:1px solid #a8a8a8;box-shadow:0 6px 18px rgba(0,0,0,.35);padding:4px 0;min-width:180px;font-size:14px;z-index:100;border-radius:0 0 5px 5px}
.menu .mi{display:flex;align-items:center;padding:1px 18px 1px 20px;height:19px;white-space:nowrap;position:relative;cursor:default}
.menu .mi .ck{position:absolute;left:6px;font-size:12px}
.menu .mi .sc{margin-left:auto;padding-left:28px;color:#333;font-size:13px}
.menu .mi .ar{margin-left:auto;padding-left:24px;font-size:10px}
.menu .mi.dis{color:var(--text-off)}
.menu .mi.dis .sc{color:var(--text-off)}
.menu .mi:not(.dis):hover,.menu .mi.hot{background:var(--sel);color:#fff}
.menu .mi:not(.dis):hover .sc,.menu .mi.hot .sc{color:#fff}
.menu .sep{height:1px;background:#d2d2d2;margin:5px 1px}

/* ---------- application bar (workspace switcher) ---------- */
#appbar{height:26px;background:linear-gradient(#cfcfcf,#b3b3b3);border-bottom:1px solid #7d7d7d;display:flex;align-items:center;padding:0 8px;gap:8px}
#wsSwitch{margin-left:auto;height:18px;padding:0 6px 0 8px;display:flex;align-items:center;gap:6px;font-size:10px;font-weight:bold;letter-spacing:.04em;color:#333;border:1px solid transparent;border-radius:2px;cursor:default}
#wsSwitch:hover,#wsSwitch.open{border-color:#8f8f8f;background:linear-gradient(#e6e6e6,#c8c8c8)}
#wsSwitch .tri{font-size:8px}

/* ---------- workspace grid (Essentials.xml) ---------- */
#ws{position:absolute;top:48px;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 262px 36px;grid-template-rows:1fr 206px;background:#7d7d7d;gap:1px}
#docArea{grid-column:1;grid-row:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:#7d7d7d}
#tlDock{grid-column:1;grid-row:2;min-width:0}
#piDock{grid-column:2;grid-row:1/3;min-height:0}
#toolDock{grid-column:3;grid-row:1/3;min-height:0}
#ws.noTools{grid-template-columns:1fr 262px 0}
#ws.noPI{grid-template-columns:1fr 0 36px}
#ws.noTools.noPI{grid-template-columns:1fr 0 0}
#ws.noTL{grid-template-rows:1fr 0}

/* ---------- generic panel frame ---------- */
.dock{display:flex;flex-direction:column;background:var(--panel);height:100%;overflow:hidden;border-left:1px solid #9a9a9a}
.dockbar{height:11px;flex:none;background:linear-gradient(#5c5c5c,#474747);display:flex;justify-content:flex-end;align-items:center;padding-right:3px}
.dockbar img{filter:invert(1) brightness(1.6);opacity:.85}
.tabs{height:22px;flex:none;display:flex;align-items:flex-end;background:var(--tabstrip);border-bottom:1px solid #8e8e8e;padding-left:2px;position:relative}
.tab{height:19px;padding:0 10px;display:flex;align-items:center;font-size:10px;font-weight:bold;letter-spacing:.02em;color:#3c3c3c;background:var(--tab-off);border:1px solid #8e8e8e;border-bottom:none;border-radius:3px 3px 0 0;margin-right:-1px;cursor:default;white-space:nowrap}
.tab.on{background:var(--panel);color:#111;height:21px;margin-bottom:-1px;position:relative;z-index:1}
.tabs .pmenu{position:absolute;right:5px;top:6px;cursor:default;opacity:.85}
.tabs .pmenu:hover{opacity:1}
.pbody{flex:1;min-height:0;overflow:auto;position:relative}

/* ---------- Tools panel (toolspanel.xml) ---------- */
#tools{display:flex;flex-direction:column;align-items:center;padding:4px 0 6px}
.tool{width:26px;height:24px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:2px;position:relative;cursor:default}
.tool:hover{border-color:#a8a8a8;background:linear-gradient(#f9f9f9,#dedede)}
.tool.on{border-color:#6a6a6a;background:linear-gradient(#bdbdbd,#d6d6d6);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.tool .fly{position:absolute;right:1px;bottom:1px;width:0;height:0;border-left:4px solid transparent;border-bottom:4px solid #222}
.tool img{max-width:22px;max-height:22px}
.tdiv{width:28px;height:2px;margin:4px 0;border-top:1px solid #b3b3b3;border-bottom:1px solid #fbfbfb}
.colorRow{display:flex;align-items:center;gap:2px;margin:2px 0}
.swatchBtn{width:20px;height:16px;border:1px solid #4d4d4d;position:relative;cursor:default;background:#fff}
.swatchBtn .tri{position:absolute;right:0;bottom:0;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid #000}
.swatchBtn.none{background:#fff linear-gradient(to top right,transparent 46%,#e00 47%,#e00 53%,transparent 54%)}
.colorCol{display:flex;flex-direction:column;align-items:center;gap:1px}
.miniRow{display:flex;gap:1px;margin-top:2px}
.mini{min-width:15px;min-height:15px;padding:1px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;cursor:default}
.mini:hover{border-color:#999;background:#f6f6f6}
.mini.on{border-color:#6a6a6a;background:#cdcdcd}
#toolOpts{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
.flyout{position:fixed;background:#ececec;border:1px solid #6d6d6d;box-shadow:2px 3px 10px rgba(0,0,0,.35);padding:2px 0;z-index:90;font-size:11px}
.flyout .fi{display:flex;align-items:center;gap:6px;padding:2px 18px 2px 4px;height:24px;white-space:nowrap;cursor:default}
.flyout .fi .k{margin-left:auto;padding-left:24px;color:#555}
.flyout .fi .dot{width:6px;font-size:9px}
.flyout .fi:hover{background:var(--sel);color:#fff}
.flyout .fi:hover .k{color:#fff}
.flyout .fi:hover img{filter:brightness(1.4)}
.tip{position:fixed;background:#ffffe1;border:1px solid #777;padding:1px 4px;font-size:11px;z-index:200;pointer-events:none;white-space:nowrap;box-shadow:1px 1px 2px rgba(0,0,0,.2)}

/* ---------- Document window ---------- */
#docTabs{height:23px;flex:none;background:var(--tabstrip);border-bottom:1px solid #8e8e8e;display:flex;align-items:flex-end;padding-left:4px}
#docTabs .dtab{height:20px;display:flex;align-items:center;gap:8px;padding:0 6px 0 10px;background:var(--panel);border:1px solid #8e8e8e;border-bottom:none;border-radius:3px 3px 0 0;margin-bottom:-1px;font-size:11px;cursor:default}
#docTabs .dtab .x{width:11px;height:11px;opacity:.6}
#docTabs .dtab .x:hover{opacity:1}
#editBar{height:28px;flex:none;background:linear-gradient(#f3f3f3,#dcdcdc);border-bottom:1px solid #9c9c9c;display:flex;align-items:center;padding:0 6px;gap:6px}
#editBar .crumb{display:flex;align-items:center;gap:4px}
#editBar .eb{display:flex;align-items:center;justify-content:center;width:24px;height:22px;border:1px solid transparent;border-radius:2px}
#editBar .eb:hover{border-color:#999;background:#f8f8f8}
#editBar .eb.dis{opacity:.35}
#editBar .right{margin-left:auto;display:flex;align-items:center;gap:2px}
#zoomSel{height:19px;font:11px var(--font);border:1px solid #8a8a8a;background:#fff;width:76px;margin-left:6px}
#stageWrap{flex:1;min-height:0;overflow:hidden;background:var(--pasteboard);position:relative}
#stageInner{position:relative}
#stage{position:absolute;background:var(--stage);box-shadow:2px 2px 0 #585858, 0 0 0 1px #8a8a8a}
#stage svg{position:absolute;inset:0;overflow:visible}
#stageWrap.c-cross{cursor:crosshair}
#stageWrap.c-hand{cursor:grab}
#stageWrap.c-text{cursor:text}
#stageWrap.c-zoom{cursor:zoom-in}
#stageWrap.c-zoomout{cursor:zoom-out}
#stageWrap.c-copy{cursor:copy}
#stageWrap.c-brush{cursor:none;touch-action:none}
body{-webkit-touch-callout:none}
#stageWrap,#ruler,.hot,.tool{touch-action:none}
#brushCur{position:fixed;pointer-events:none;z-index:40;overflow:visible;display:none}
.selbox{fill:none;stroke:#3a6fdc;stroke-width:1;vector-effect:non-scaling-stroke;pointer-events:none}
.marquee{fill:rgba(0,0,0,.03);stroke:#000;stroke-dasharray:2 2;vector-effect:non-scaling-stroke}
.txt{font-family:"Times New Roman",Times,serif;font-size:12px}

/* ---------- Welcome screen (StartPage/resources/config.xml) ---------- */
#welcome{flex:1;display:flex;align-items:center;justify-content:center;background:#7d7d7d;overflow:auto;min-height:0}
.sp{width:650px;height:500px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;flex-direction:column;font-family:Arial,Helvetica,sans-serif;flex:none}
.sp .banner{height:104px;flex:none}
.sp .list{height:262px;flex:none;display:flex;padding:15px 16px 0;background-size:650px 262px;background-repeat:no-repeat}
.sp .col{width:206px;padding-right:12px}
.sp .col+.col{padding-left:14px}
.sp .hd{height:27px;font-size:13px;font-weight:bold;color:#555;border-bottom:1px solid #d8d8d8;margin-bottom:4px;display:flex;align-items:center}
.sp .it{height:22px;display:flex;align-items:center;gap:6px;font-size:11px;color:#000;padding-left:8px;cursor:pointer;white-space:nowrap}
.sp .it:hover{text-decoration:underline}
.sp .it img{width:17px;height:17px;object-fit:contain}
.sp .links{height:110px;flex:none;display:flex;align-items:center;gap:22px;padding:0 16px;border-top:1px solid #e0e0e0}
.sp .links .lk{display:flex;align-items:center;gap:6px;font-size:11px;color:#000}
.sp .links .lk:hover{text-decoration:underline;cursor:pointer}
.sp .links .tips{margin-left:auto;display:flex;align-items:center;gap:10px;color:#555;font-size:11px;width:230px}
.sp .foot{height:24px;flex:none;background:#eee;display:flex;align-items:center;padding:0 16px;gap:6px;font-size:11px;border-top:1px solid #ddd}

/* ---------- Property Inspector ---------- */
.piHdr{display:flex;align-items:center;height:60px;padding:0 0 0 16px;border-bottom:1px solid #c9c9c9}
.piHdr .ttl{margin-left:15px;line-height:1.9}
.piHdr .ttl b{font-weight:normal;font-size:12px}
.piHdr .ttl .sub{color:#333}
.sec{border-bottom:1px solid #c9c9c9}
.secHd{height:22px;display:flex;align-items:center;gap:4px;padding-left:5px;font-size:10px;font-weight:bold;color:#3b3b3b;letter-spacing:.03em;cursor:default}
.secHd img{width:9px;height:9px}
.secBody{padding:2px 0 8px}
.row{display:flex;align-items:center;min-height:26px}
.row .lbl{width:67px;text-align:right;padding-right:5px;color:#333}
.row .val{flex:1;display:flex;align-items:center;gap:6px;padding-left:0}
.hot{color:var(--hot);border-bottom:1px dotted var(--hot);cursor:ew-resize;padding:0 1px}
.hot:focus{outline:1px solid var(--hot);background:#fff;color:#000}
.txtin{height:19px;width:130px;border:1px solid #9a9a9a;background:#fff;font:11px var(--font);padding:0 3px;box-shadow:inset 0 1px 1px rgba(0,0,0,.15)}
.btn{height:19px;padding:0 8px;border:1px solid #8b8b8b;border-radius:9px;background:linear-gradient(#fdfdfd,#dcdcdc);font-size:11px;display:inline-flex;align-items:center;cursor:default}
.btn:active{background:linear-gradient(#cfcfcf,#e8e8e8)}
.btn.push{margin-left:auto;margin-right:30px;width:50px;justify-content:center}
.smallSw{width:30px;height:15px;border:1px solid #4d4d4d;position:relative;cursor:default}
.smallSw .tri{position:absolute;right:0;bottom:0;border-left:5px solid transparent;border-bottom:5px solid #000}
.piEmpty{padding:24px 12px;color:var(--text-dim);text-align:center}

/* ---------- Library (librarypanel.xml) ---------- */
#lib{display:flex;flex-direction:column;height:100%}
.libTop{height:28px;flex:none;display:flex;align-items:center;padding:0 4px;gap:4px;border-bottom:1px solid #c4c4c4}
.libTop select{flex:1;height:19px;font:11px var(--font)}
.libTop .ib{width:20px;height:18px;display:flex;align-items:center;justify-content:center;border:1px solid transparent}
.libTop .ib:hover{border-color:#999}
.libPrev{height:136px;flex:none;background:#fff;border-bottom:1px solid #c4c4c4;position:relative;display:flex;align-items:center;justify-content:center;color:#888}
.libPrev .pp{position:absolute;right:0;top:0;display:flex}
.libFilter{height:22px;flex:none;display:flex;align-items:center;gap:4px;padding:0 4px;border-bottom:1px solid #c4c4c4}
.libFilter .cnt{width:95px;color:#333}
.libFilter input{flex:1;height:17px;border:1px solid #9a9a9a;border-radius:9px;font:11px var(--font);padding:0 8px}
.libHead{height:18px;flex:none;display:flex;background:linear-gradient(#fafafa,#e1e1e1);border-bottom:1px solid #aaa;font-size:11px}
.libHead div{padding:0 6px;border-right:1px solid #bdbdbd;display:flex;align-items:center}
.libList{flex:1;overflow:auto;background:#fff}
.libItem{height:18px;display:flex;align-items:center;gap:5px;padding-left:6px;cursor:default}
.libItem.sel{background:var(--sel);color:#fff}
.libItem:nth-child(even):not(.sel){background:#f2f5fa}
.libBot{height:22px;flex:none;display:flex;align-items:center;gap:4px;padding:0 6px;border-top:1px solid #c4c4c4}
.libBot .ib{width:18px;height:16px;display:flex;align-items:center;justify-content:center}
.libBot .ib:hover{background:#d8d8d8}

/* ---------- Timeline (timelinepanel.xml) ---------- */
#tl{display:flex;flex-direction:column;height:100%}
#tlMain{flex:1;display:flex;min-height:0}
#tlLayers{width:216px;flex:none;display:flex;flex-direction:column;border-right:1px solid #9a9a9a;background:var(--panel)}
.tlHdr{height:21px;flex:none;display:flex;align-items:center;border-bottom:1px solid #aaa;background:var(--panel)}
.tlHdr .ic{width:19px;display:flex;justify-content:center}
.tlHdr .sp{flex:1}
#layerRows{flex:1;overflow:hidden}
.lrow{height:20px;display:flex;align-items:center;border-bottom:1px solid #d6d6d6;cursor:default;background:#fff}
.lrow.cur{background:var(--layer-sel);color:#fff}
.lrow .li{width:22px;display:flex;justify-content:center}
.lrow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .pen{width:20px;display:flex;justify-content:center}
.lrow .cell{width:19px;display:flex;justify-content:center;align-items:center;font-size:12px;line-height:1}
.lrow .dotc{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.75}
.lrow .ol{width:9px;height:9px;border:1.5px solid}
.lrow.cur img{filter:brightness(0) invert(1)}
#tlFrames{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;position:relative;overflow:hidden}
#ruler{height:21px;flex:none;position:relative;border-bottom:1px solid #aaa;background:linear-gradient(#fff,#ececec);overflow:hidden;cursor:pointer}
#ruler .tick{position:absolute;bottom:0;width:1px;height:4px;background:#888}
#ruler .num{position:absolute;top:2px;font-size:9px;color:#333;transform:translateX(-50%)}
#frameRows{flex:1;position:relative;overflow:hidden}
.frow{height:20px;position:relative;border-bottom:1px solid #d6d6d6}
.frow canvas{position:absolute;left:0;top:0}
#playhead{position:absolute;top:0;bottom:0;width:8px;pointer-events:none}
#playhead .cap{position:absolute;top:2px;left:-0px;width:8px;height:16px;background:rgba(204,0,0,.55);border:1px solid #c00}
#playhead .ln{position:absolute;top:20px;bottom:0;left:3.5px;width:1px;background:var(--tl-playhead)}
#tlStatus{height:22px;flex:none;display:flex;align-items:center;border-top:1px solid #aaa;background:var(--panel)}
#tlStatus .left{width:216px;display:flex;align-items:center;gap:3px;padding-left:5px;border-right:1px solid #aaa;height:100%}
#tlStatus .ib{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border:1px solid transparent}
#tlStatus .ib:hover{border-color:#999;background:#f6f6f6}
#tlStatus .ib.on{border-color:#666;background:#cfcfcf}
#tlStatus .stat{display:flex;align-items:center;gap:4px;padding-left:6px}
#tlStatus .hv{min-width:28px;text-align:right}
.meEmpty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-dim);background:#fff}

/* swatch popup */
#swatchPop{position:fixed;background:#e9e9e9;border:1px solid #555;box-shadow:2px 3px 10px rgba(0,0,0,.4);z-index:120;padding:4px}
#swatchPop .top{display:flex;align-items:center;gap:4px;margin-bottom:4px}
#swatchPop .prev{width:44px;height:20px;border:1px solid #333}
#swatchPop input{width:64px;height:18px;font:11px Monaco,monospace;border:1px solid #888}
#swatchPop .alpha{font-size:11px;color:#333}
#swatchPop .grid{display:grid;grid-template-columns:repeat(20,10px);grid-auto-rows:10px;gap:0;background:#000;border:1px solid #000;width:fit-content}
#swatchPop .grid div{width:10px;height:10px;border-right:1px solid #000;border-bottom:1px solid #000}
#swatchPop .grid div:hover{outline:1px solid #fff;outline-offset:-1px}
#swatchPop .ib{width:20px;height:18px;display:flex;align-items:center;justify-content:center;border:1px solid transparent}
#swatchPop .ib:hover{border-color:#888}

/* modal (Document Properties) */
.modalBg{position:fixed;inset:0;background:rgba(0,0,0,.15);z-index:150;display:flex;align-items:flex-start;justify-content:center}
.modal{margin-top:80px;background:#ececec;border:1px solid #777;box-shadow:0 10px 30px rgba(0,0,0,.45);border-radius:5px;width:440px;font-size:12px}
.modal .mt{height:22px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#ededed,#cfcfcf);border-bottom:1px solid #999;border-radius:5px 5px 0 0;font-size:13px}
.modal .mb{padding:14px 18px}
.modal .fr{display:flex;align-items:center;gap:8px;margin:7px 0}
.modal .fr label{width:120px;text-align:right}
.modal input[type=text],.modal input[type=number]{width:70px;height:20px;font:12px var(--font)}
.modal .btns{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
.modal .mbtn{height:21px;min-width:72px;border:1px solid #888;border-radius:11px;background:linear-gradient(#fff,#dadada);font-size:12px}
.modal .mbtn.def{background:linear-gradient(#b8d4fb,#5a97ec);border-color:#3c6fbd}

/* touch, text editing, library drag */
html{touch-action:manipulation}
.tedit{position:absolute;left:0;top:0;transform-origin:0 0;outline:1px solid #000;outline-offset:1px;min-width:6px;min-height:1em;white-space:pre;user-select:text;-webkit-user-select:text;touch-action:auto;cursor:text;z-index:5}
.chk{display:inline-flex;align-items:center;gap:4px;cursor:default}
.libGhost{position:fixed;pointer-events:none;z-index:300;opacity:.85}
.libItem{touch-action:none}
/* workspaces */
.dockbar{cursor:default}
#tools.two{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:flex-start;padding:4px 2px 6px}
#tools.two>.tdiv{width:56px}
#tools.two>.colorCol,#tools.two>#toolOpts{width:100%}
#tools.two #toolOpts{flex-direction:row;flex-wrap:wrap;justify-content:center}
.split{position:absolute;z-index:20;touch-action:none}
.split.sv{width:7px;cursor:ew-resize}
.split.sh{height:7px;cursor:ns-resize}
.split:hover,.split:active{background:rgba(56,117,215,.35)}
.dockCol{display:flex;flex-direction:column;height:100%}
.dockCol>.dock{height:auto;min-height:0}
.split.hs{position:static;height:6px;flex:none;background:#8e8e8e;cursor:ns-resize}
.wsList{min-height:60px;max-height:240px;overflow:auto;border:1px solid #aaa;background:#fff;margin-bottom:6px}
.wsRow{display:flex;align-items:center;gap:6px;padding:4px 6px;border-bottom:1px solid #eee}
.wsRow span{flex:1}
.wsEmpty{padding:14px;color:#777;text-align:center}
.wsErr{color:#b00;min-height:14px;margin-left:128px}

/* ---- CS4 skin, calibrated against a CS4 interface screenshot ---- */
:root{--panel:#d6d6d6;--tabstrip:#959595;--tab-off:#a4a4a4;--pasteboard:#d3d3d3;--layer-sel:#78a8d8}
body{background:#8e8e8e}
#ws{background:#808080}
#appbar{background:#d6d6d6;border-bottom:1px solid #8f8f8f;height:26px;padding:0 6px}
#wsSwitch{font-size:11px;color:#222}
.abSep{width:1px;height:16px;background:#a3a3a3;box-shadow:1px 0 #efefef;margin:0 6px}
#helpSearch{display:flex;align-items:center;gap:2px;height:19px;width:176px;background:#fff;border:1px solid #8a8a8a;border-radius:2px;padding:0 4px 0 2px;box-shadow:inset 0 1px 1px rgba(0,0,0,.12)}
#helpSearch img{width:21px;height:15px}
#helpSearch input{border:none;outline:none;font:11px var(--font);width:100%;background:transparent;padding:0;color:#222}
.dock{border-left:1px solid #7a7a7a}
.dockbar{height:14px;background:linear-gradient(#636363,#4b4b4b);border-bottom:1px solid #3b3b3b}
.tabs{height:22px;background:var(--tabstrip);border-bottom:1px solid #777;padding-left:0}
.tab{height:21px;padding:0 9px;border:none;border-right:1px solid #7a7a7a;border-radius:0;background:var(--tab-off);color:#2b2b2b;margin:0;font-size:10px;letter-spacing:.01em}
.tab.on{background:var(--panel);height:22px;margin-bottom:-1px;color:#111}
.piHdr{height:54px;align-items:flex-start;padding:12px 0 0 22px;border-bottom:1px solid #b9b9b9;box-shadow:0 1px 0 #e9e9e9}
.piHdr .piIcon{width:24px;height:24px;object-fit:contain}
.piHdr .ttl{margin-left:28px;line-height:1.55}
.piHdr .ttl b{font-size:11px}
.sec{border-bottom:none}
.secHd{height:21px;background:#cacaca;border-top:1px solid #e8e8e8;border-bottom:1px solid #b5b5b5;padding-left:6px;font-size:10px;color:#2e2e2e}
.secBody{padding:3px 0 6px}
.row{min-height:25px}
.row .lbl{width:78px;color:#222;white-space:nowrap}
.rowsep{height:1px;background:#b9b9b9;box-shadow:0 1px 0 #ececec;margin:3px 6px 3px 4px}
.numIn{width:50px;height:19px;border:1px solid #8a8a8a;background:#fff;font:11px var(--font);padding:0 3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.12);border-radius:0}
.sfield{display:inline-flex;align-items:center;gap:8px}
.slider{position:relative;width:110px;height:18px;touch-action:none;cursor:default;flex:none}
.slider .trk{position:absolute;left:5px;right:5px;top:8px;height:3px;border:1px solid #8c8c8c;border-radius:2px;background:linear-gradient(#b7b7b7,#ededed)}
.slider .th{position:absolute;top:2px;display:block}
.idrop{display:inline-flex;align-items:center;gap:2px;height:19px;padding:0 3px;border:1px solid transparent;border-radius:2px;cursor:default}
.idrop:hover{border-color:#9a9a9a;background:linear-gradient(#f4f4f4,#dcdcdc)}
.idrop img{max-height:13px}
.idrop .ar{font-size:9px;color:#444;border-left:1px solid #9a9a9a;padding-left:3px}
.btn{border-radius:3px;background:linear-gradient(#fbfbfb,#dadada);border-color:#8a8a8a;height:20px;padding:0 12px}
.btn.push{border-radius:3px}
.chk.dis{color:#9a9a9a}
.rgrid{display:grid;grid-template-columns:repeat(2,auto);gap:4px 10px}
.rlock img{width:14px;height:14px}
#docTabs{background:#9a9a9a;border-bottom:1px solid #777;height:24px;padding-left:2px}
#docTabs .dtab{border-radius:0;background:#dedede;border:1px solid #777;border-bottom:none;height:21px;font-weight:bold;color:#222}
#editBar{background:var(--panel);border-bottom:1px solid #a9a9a9;height:30px}
.tool.on{border-color:#7a7a7a;background:linear-gradient(#fdfdfd,#dedede);box-shadow:inset 0 0 0 1px #fff;border-radius:3px}
.tool:hover{border-color:#a2a2a2;background:linear-gradient(#f7f7f7,#e2e2e2);border-radius:3px}
.tdiv{border-top-color:#acacac;border-bottom-color:#efefef}
.colorCol.stack .colorRow{flex-direction:column;gap:2px;margin:3px 0}
.colorCol.stack .swatchBtn{width:24px;height:15px}
.colorCol.stack .miniRow{flex-direction:column;align-items:center}
#tlLayers{background:#ebebeb}
.tlHdr{background:var(--panel);height:22px}
.lrow{background:#f4f4f4;border-bottom-color:#dcdcdc}
.lrow.cur{background:var(--layer-sel)}
#tlStatus{background:var(--panel);border-top:1px solid #a9a9a9}
#tlStatus .stat{gap:6px}
#ruler{background:linear-gradient(#f9f9f9,#e6e6e6)}
.hot{border-bottom:1px dotted var(--hot)}

/* ---- refined against screen captures of CS4 in use (exact colours) ---- */
:root{--panel:#dddddd;--pasteboard:#dcdcdc;--layer-sel:#6dafde;--tabstrip:#9c9c9c;--tab-off:#b0b0b0}
#appbar{background:#dddddd}
.piHdr{height:auto;min-height:60px;padding:8px 0 10px 22px;border-bottom:none;box-shadow:none}
.piHdr .piIcon{width:auto;height:auto;max-width:44px;max-height:44px}
.piHdr .ttl{margin-left:20px;line-height:2.05}
.secHd{background:#d5d5d5;border-top:1px solid #c9c9c9;border-bottom:1px solid #ececec;height:22px}
.rowsep{background:#cbcbcb;box-shadow:0 1px 0 #ececec;margin:2px 0 2px 2px}
.row .lbl{width:84px}
.txtin:disabled{background:#dcdcdc;border-color:#c2c2c2;box-shadow:none}
.stEdit{display:inline-flex;margin-left:8px}
.stEdit.off,.off .stEdit{opacity:.4}
.row.off{color:#9b9b9b;pointer-events:none}
.row.off .numIn,.row.off select{color:#a8a8a8;background:#e6e6e6;border-color:#c4c4c4}
.row.off .slider{opacity:.55}
.row.off .hot{color:#9b9b9b;border-bottom-color:#9b9b9b}
.smallSw.off{opacity:.8;cursor:default}
.idrop .dash{color:#777;padding:0 2px}
.btn{background:linear-gradient(#fafafa,#e1e1e1);border-color:#9b9b9b;border-radius:2px}
.btn.dis{color:#a9a9a9;border-color:#c3c3c3;background:#e4e4e4;pointer-events:none}
.tool.on{border-color:#7c7c7c;background:linear-gradient(#949494,#a8a8a8);box-shadow:inset 0 1px 2px rgba(0,0,0,.35);border-radius:2px}
#docTabs{background:#a0a0a0;border-bottom:1px solid #7f7f7f}
#docTabs .dtab{background:#dddddd;font-weight:normal;border-color:#7f7f7f}
#tlLayers,#tlFrames,#frameRows{background:#eaeaea}
.lrow{background:transparent;border-bottom-color:#d3d3d3}
.frow{border-bottom-color:#d3d3d3}
#stageWrap{background:var(--pasteboard)}
.sbar{position:absolute;display:flex;background:#f3f3f3;z-index:6;touch-action:none}
.sbar.v{right:0;top:0;bottom:15px;width:15px;flex-direction:column;border-left:1px solid #d0d0d0}
.sbar.h{left:0;right:15px;bottom:0;height:15px;border-top:1px solid #d0d0d0}
.sbar .trk{position:relative;flex:1}
.sbar .thm{position:absolute;background:linear-gradient(90deg,#f6f6f6,#dedede);border:1px solid #a4a4a4;border-radius:2px}
.sbar.v .thm{left:1px;right:1px}
.sbar.h .thm{top:1px;bottom:1px;background:linear-gradient(#f6f6f6,#dedede)}
.sbar .sa{flex:none;width:15px;height:15px;position:relative}
.sbar .sa::after{content:"";position:absolute;left:4px;top:5px;border:3.5px solid transparent}
.sbar.v .up::after{border-bottom:4px solid #555;top:3px}
.sbar.v .dn::after{border-top:4px solid #555;top:6px}
.sbar.h .up::after{border-right:4px solid #555;left:2px;top:4px}
.sbar.h .dn::after{border-left:4px solid #555;left:6px;top:4px}
.sbar .sa:active{background:#d8d8d8}
.scorner{position:absolute;right:0;bottom:0;width:15px;height:15px;background:#e6e6e6;z-index:6}

/* timeline frames, onion markers, export + Test Movie */
#rulerIn{position:absolute;left:0;top:0;bottom:0;width:3200px}
#onionMk{position:absolute;top:0;height:9px;background:rgba(70,70,70,.16);border:1px solid #777;border-top:none;display:none;pointer-events:none}
#frameRows{touch-action:none}
.modal.tm{width:auto;max-width:94vw}
.tmBody{padding:10px;background:#7a7a7a;display:flex;flex-direction:column;align-items:center;gap:6px}
.tmBody canvas{max-width:86vw;max-height:66vh;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.tmStat{color:#f2f2f2;font-size:11px;min-height:14px}
.modal.tm .btns{padding:8px 12px 10px;margin:0}
.exProg{min-height:16px;color:#333;margin-left:128px;font-size:11px}

/* colour panel, swatches, gradient swatches */
.tabs .tab{padding:0 6px}
.cpanel{padding:6px 8px 10px;display:flex;flex-direction:column;gap:5px}
.cpanel .row .lbl{width:58px}
.cpTop{display:flex;align-items:center;gap:5px}
.cpTgt{display:flex;align-items:center;gap:3px;padding:2px 3px;border:1px solid transparent;border-radius:2px;cursor:default}
.cpTgt.on{border-color:#7a7a7a;background:#c6c6c6}
.cpSw{width:30px;height:15px;border:1px solid #4d4d4d}
.cpSw.none{background:#fff linear-gradient(to top right,transparent 46%,#e00 47%,#e00 53%,transparent 54%)!important}
.cpPick{display:flex;gap:6px;align-items:flex-start}
.cpSV{position:relative;width:200px;height:118px;border:1px solid #777;touch-action:none;cursor:crosshair;flex:none}
.cpDot{position:absolute;width:9px;height:9px;margin:-5px 0 0 -5px;border:1px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000;pointer-events:none}
.cpHue{position:relative;width:14px;height:118px;border:1px solid #777;background:linear-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);touch-action:none;flex:none}
.cpHk{position:absolute;left:-3px;right:-3px;height:4px;margin-top:-2px;border:1px solid #000;background:#fff;pointer-events:none}
.cpFields{display:grid;grid-template-columns:repeat(4,auto 46px);gap:3px 4px;align-items:center;font-size:10px}
.cpFields .numIn{width:46px;padding:0 2px}
.cpFields .hexIn{grid-column:span 3;width:70px}
.cpRamp{position:relative;height:18px;border:1px solid #6f6f6f;margin:4px 6px 0;cursor:copy;touch-action:none;background-color:#fff}
.cpPtrs{position:relative;height:18px;margin:0 6px}
.cpPtr{position:absolute;top:0;width:11px;height:16px;margin-left:-6px;touch-action:none;cursor:ew-resize}
.cpPtr::before{content:"";position:absolute;left:2px;top:-2px;border:3.5px solid transparent;border-bottom:5px solid #444;border-top:none}
.cpPtr i{position:absolute;left:0;top:4px;width:9px;height:9px;border:1px solid #444}
.cpPtr.on i{outline:2px solid #0b4fd1}
.swPanel{padding:6px;display:flex;flex-direction:column;gap:5px}
.swGrid{display:grid;grid-template-columns:repeat(20,11px);grid-auto-rows:11px;border:1px solid #000;width:fit-content;background:#000}
.swGrid div{border-right:1px solid #000;border-bottom:1px solid #000;cursor:default}
.swGrid div:hover,.swGrads div:hover{outline:1px solid #fff;outline-offset:-1px}
.swGrads{display:flex;gap:3px;flex-wrap:wrap}
.swGrads div{width:20px;height:14px;border:1px solid #333}
.bmGrid{display:flex;flex-wrap:wrap;gap:4px}
.bmGrid img{width:46px;height:46px;object-fit:cover;border:1px solid #888;background:#fff}
.bmGrid img.on{outline:2px solid #3875d7}
#swatchPop .grads{display:flex;gap:2px;margin-top:4px}
#swatchPop .grads div{width:20px;height:12px;border:1px solid #000}
#swatchPop .alpha .hot{margin-left:2px}

/* symbol edit breadcrumbs, filters, frame properties */
#editBar .crumb{cursor:default;padding:2px 4px;border-radius:2px}
#editBar .crumb:hover{background:rgba(0,0,0,.07)}
#editBar .crSep{color:#666;font-size:9px;margin:0 2px}
#editBar .eb:not(.dis){cursor:default}
.fltHd{display:flex;align-items:center;gap:8px;padding:4px 8px 2px;border-top:1px solid #c8c8c8;margin-top:4px}
.fltHd b{flex:1;font-size:11px}
.fltHd .btn{height:17px;padding:0 6px;font-size:10px}
.dim{color:#777;font-size:10px}

/* ---- menu additions: text styles, preview modes, dialogs ---- */
#svg[data-pv=fast]{shape-rendering:crispEdges;image-rendering:pixelated}
#svg[data-pv=fast] text,#svg[data-pv=aa] text{text-rendering:optimizeSpeed;-webkit-font-smoothing:none}
.modal .fr label.chk{width:auto;text-align:left}
.kbList{max-height:320px}
.kbList .wsRow b{font-weight:normal;color:#333;white-space:nowrap}
</style>

const LAYER_COLORS=['#4f80ff','#ff4fff','#4fffff','#ff4f4f','#4fff4f','#ffff4f','#9933cc','#ff9933'];
function addLayer(){const d=S.doc;if(!d)return;snapshot();const n=d.nextLayer++;shiftLayers(d.curLayer,1);
  d.layers.splice(d.curLayer,0,{name:'Layer '+n,visible:true,locked:false,outline:false,color:LAYER_COLORS[(n-1)%8],frames:{1:[]},len:Math.max(1,maxLen())});
  renderTLDock();renderStage()}
const insertFrame=kind=>frameOp(kind),removeFrame=()=>frameOp('remove');
// F5 frame, F6 keyframe (copies the content it covers), F7 blank keyframe, Shift+F5 remove frame, Shift+F6 clear keyframe
function frameOp(kind){
  const d=S.doc;if(!d)return;const L=d.layers[d.curLayer];if(!L||L.folder)return;
  closeText();penEnd();stopPlay();snapshot();let f=d.frame;
  const shift=(from,by)=>{const nf={};Object.keys(L.frames).map(Number).sort((a,b)=>a-b).forEach(i=>{nf[i>=from?i+by:i]=L.frames[i]});L.frames=nf};
  switch(kind){
    case 'frame':if(f>L.len)L.len=f;else{shift(f+1,1);L.len++}break;
    case 'key':case 'blank':{
      if(L.frames[f]&&f<=L.len){f++;if(L.frames[f]){shift(f,1);L.len++}}   // on a keyframe, the next frame becomes the new keyframe
      const ck=keyAt(L,Math.min(f,L.len));
      L.frames[f]=kind==='key'&&ck!==null?L.frames[ck].map(cloneShape):[];L.len=Math.max(L.len,f);break}
    case 'remove':if(f>L.len||(L.len<=1))break;
      if(L.frames[f]&&(f>1||L.frames[2]))delete L.frames[f];shift(f+1,-1);L.len--;if(!L.frames[1])L.frames[1]=[];break;
    case 'clearkey':if(f>1&&L.frames[f])delete L.frames[f];break;
  }
  d.frame=f;d.sel.clear();subSel=null;loadFrame();scrollTLTo(f);renderStage();renderTLDock();renderPI();
}

function addFolder(){const d=S.doc;if(!d)return;snapshot();shiftLayers(d.curLayer,1);   // above the current layer, as Flash does

/* ---- frame selection and Edit > Timeline ----
   d.fsel = {a:[layer,frame] anchor, b:[layer,frame] other corner}; without one, the selection is the current frame. */
function fselRange(){const d=S.doc,F=d.fsel;if(!F)return{l0:d.curLayer,l1:d.curLayer,f0:d.frame,f1:d.frame};const c=v=>Math.max(0,Math.min(d.layers.length-1,v));
  return{l0:c(Math.min(F.a[0],F.b[0])),l1:c(Math.max(F.a[0],F.b[0])),f0:Math.max(1,Math.min(F.a[1],F.b[1])),f1:Math.max(1,F.a[1],F.b[1])}}
const fresh=s=>{const c=cloneShape(s);delete c._tw;delete c._kf;return c};
// empties frames a..b of L for new content, first making frame b+1 a keyframe so that what follows is unchanged
function vacate(L,a,b){
  if(b<L.len&&!L.frames[b+1]){const k=keyAt(L,b+1),tw=tweenAt(L,b+1);L.frames[b+1]=(tw?frameContent(L,b+1):L.frames[k]).map(fresh);if(tw&&L.tweens[k])L.tweens[b+1]={...L.tweens[k]}}
  for(const n in L.frames)if(+n>=a&&+n<=b)delete L.frames[n];
  ['tweens','labels','poses'].forEach(p=>{if(L[p])for(const n in L[p])if(+n>=a&&+n<=b)delete L[p][n]})}
const framesDone=()=>{const d=S.doc;d.sel.clear();subSel=null;loadFrame();renderTLDock();renderStage();renderPI()};
// the clipboard keeps one entry per selected layer: its length and keyframes by offset (the first selected frame always starts one)
function copyFrames(cut){const d=S.doc;if(!d)return;closeText();commitFrame();const R=fselRange(),clip=[];
  for(let i=R.l0;i<=R.l1;i++){const L=d.layers[i];if(L.folder||L.pose){clip.push(null);continue}
    const e=Math.min(R.f1,L.len),o={len:Math.max(0,e-R.f0+1),keys:{},tweens:{},labels:{}};
    for(let f=R.f0;f<=e;f++){const key=!!L.frames[f];if(!key&&f>R.f0)continue;const k=keyAt(L,f),tw=key?null:tweenAt(L,f),off=f-R.f0,t=L.tweens&&L.tweens[k];
      o.keys[off]=(tw?frameContent(L,f):L.frames[k]).map(fresh);if(t&&(key||tw))o.tweens[off]={...t};if(key&&L.labels&&L.labels[f])o.labels[off]=L.labels[f]}

// pasting replaces as many frames as were copied, starting at the first selected frame
function pasteFrames(){const d=S.doc,C=S.frameClip;if(!d||!C)return;closeText();stopPlay();commitFrame();snapshot();const R=fselRange(),f0=R.f0;let n=0;
  C.forEach((o,j)=>{const L=d.layers[R.l0+j];if(!o||!o.len||!L||L.folder||L.pose)return;n=Math.max(n,o.len);vacate(L,f0,f0+o.len-1);

// clearing leaves a blank keyframe where the selection starts
function clearFrames(){const d=S.doc;if(!d)return;closeText();stopPlay();commitFrame();snapshot();const R=fselRange();
  for(let i=R.l0;i<=R.l1;i++){const L=d.layers[i];if(L.folder||L.pose||R.f0>L.len)continue;vacate(L,R.f0,Math.min(R.f1,L.len));L.frames[R.f0]=[]}

function selectAllFrames(){const d=S.doc;if(!d)return;closeText();d.fsel={a:[0,1],b:[d.layers.length-1,maxLen()]};S.frameSel=true;d.sel.clear();renderTLDock();renderStage();renderPI()}
// mirrors the selected frames: a span showing X over frames p..e plays at a+b-e..a+b-p; a tween between two selected
// keyframes is rebuilt to run the other way (ease and rotation direction flipped)
function reverseFrames(){const d=S.doc;if(!d)return;const R=fselRange();if(R.f1<=R.f0)return;closeText();stopPlay();commitFrame();snapshot();
  for(let i=R.l0;i<=R.l1;i++){const L=d.layers[i],a=R.f0,b=Math.min(R.f1,L.len);if(L.folder||L.pose||b<=a)continue;

      segs.push({arr:key?L.frames[k]:(tweenAt(L,f)?frameContent(L,f):L.frames[k]).map(fresh),s:f,e,lab:key&&L.labels&&L.labels[k],tw:key&&t&&nk!==null&&nk<=b&&tweenValid(L,k)?t:null});f=e+1}

      put(m(nx.s),nx.arr,{...g.tw,ease:-(g.tw.ease||0),rotate:{cw:'ccw',ccw:'cw'}[g.tw.rotate]||g.tw.rotate});put(m(g.s),g.arr,null,g.lab)});

/* ---- Modify > Timeline > Distribute to Layers: each selected object moves to a new layer of its own, inserted below
   the layers it came from and named after its symbol or bitmap. A layer's raw shapes travel together, being one shape. ---- */
function distributeToLayers(){const d=S.doc,sel=selShapes().filter(s=>!s._tw&&!layerOf(s).pose);if(!sel.length)return;closeText();stopPlay();commitFrame();snapshot();
  const idx=s=>d.shapes.indexOf(s),groups=[],raw={};
  sel.slice().sort((a,b)=>a.layer-b.layer||idx(b)-idx(a)).forEach(s=>{if(isRaw(s)){if(!raw[s.layer])groups.push(raw[s.layer]=[]);raw[s.layer].push(s)}else groups.push([s])});

    g.forEach(x=>{const a=L0.frames[x._kf],j=a?a.indexOf(x):-1;if(j>=0)a.splice(j,1)});
    const nm=s.sym?((s.inst&&s.inst.name)||(symOf(s.sym)||{}).name):s.type==='bitmap'?(bitmapOf(s.bid)||{}).name:'',n=nm?0:d.nextLayer++,fr={1:[]};
    fr[k]=g.sort((x,y)=>idx(x)-idx(y));

  shiftLayers(ins,NL.length);d.layers.splice(ins,0,...NL);d.curLayer=ins;
  d.sel=new Set(sel.map(s=>s.id));d.selPart.clear();loadFrame();renderTLDock();renderStage();renderPI()}

  <div style="margin-top:12px;color:#555">A browser recreation of a classic animation tool, not affiliated with Adobe.</div></div>`,()=>true,'OK',false)}
function shortcutsDlg(){const rows=[],walk=(items,path)=>items.forEach(it=>{if(it.t==='-')return;if(it.sub){if(it.t!=='Workspace')walk(it.sub,path+' ▸ '+it.t);return}
    if(SHORTCUTS[it.t])rows.push(`<div class="wsRow"><span>${esc(path+' ▸ '+it.t.replace('Test %s','Test Scene'))}</span><b>${esc(SHORTCUTS[it.t])}</b></div>`)});
  MENUBAR.forEach(m=>walk(m.items,m.title));
  modal('Keyboard Shortcuts',`<div class="fr"><label>Current set:</label><select disabled><option>Adobe Standard</option></select></div><div class="fr"><label>Commands:</label><select disabled><option>Drawing Menu Commands</option></select></div>
    <div class="wsList kbList">${rows.join('')}</div>`,()=>true,'OK',false)}
function fontNameDlg(){const t=textTgt();
  const bg=modal('Copy Font Name for ActionScript',`<div class="fr"><label>Font:</label><select id="cfn">${FONTS.map(f=>`<option${f===t.font?' selected':''}>${esc(f)}</option>`).join('')}</select></div>`,()=>{
    const n=$('#cfn',bg).value,no=()=>toast('The font name could not be copied.');try{navigator.clipboard.writeText(n).then(()=>toast(`Copied “${n}”.`),no)}catch(_){no()}},'Copy')}
// File > Print prints the first frame, as Flash does by default
function printDoc(){const d=S.doc;if(!d)return;closeText();commitFrame();
  const fr=document.createElement('iframe');fr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(fr);
  try{const w=fr.contentWindow,doc=w.document;doc.open();doc.write(`<!doctype html><title>${esc(d.name)}</title><style>@page{margin:.5in}html,body{margin:0}svg{max-width:100%;height:auto}</style>${frameSVG(1)}`);doc.close();
    setTimeout(()=>{try{w.focus();w.print()}catch(_){toast('Printing isn’t available in this view.')}setTimeout(()=>fr.remove(),1000)},150)}
  catch(_){fr.remove();toast('Printing isn’t available in this view.')}}
function drawRuler(){
  const r=$('#ruler');if(!r)return;let h='<div id="rulerIn"><div id="onionMk"></div>';for(let f=1;f<=FRAMES;f++){const x=(f-1)*FW;h+=`<div class="tick" style="left:${x}px;height:${f%5===0?6:3}px"></div>`;if(f===1||f%5===0)h+=`<div class="num" style="left:${x+FW/2}px">${f}</div>`}r.innerHTML=h+'</div>'}
function drawFrames(){
  const d=S.doc;if(!d)return;const rows=document.querySelectorAll('#frameRows .frow');
  d.layers.forEach((L,i)=>{const f=rows[i];if(!f)return;const cv=$('canvas',f);const w=FRAMES*FW,h=19;cv.width=w;cv.height=h;cv.style.width=w+'px';cv.style.height=h+'px';
    const c=cv.getContext('2d');
    for(let k=0;k<FRAMES;k++){const x=k*FW;c.fillStyle=(k+1)%5===0?'#e4e4e4':'#f8f8f8';c.fillRect(x,0,FW,h);c.fillStyle='#d4d4d4';c.fillRect(x+FW-1,0,1,h)}
    if(!L.folder&&L.len>0){
      const keys=Object.keys(L.frames).map(Number).filter(k=>k<=L.len).sort((a,b)=>a-b);
      keys.forEach((k,ix)=>{const end=(keys[ix+1]?keys[ix+1]-1:L.len);const x=(k-1)*FW,ww=(end-k+1)*FW;const full=L.frames[k].length>0,tw=L.tweens&&L.tweens[k];
        c.fillStyle=tw?(tw.type==='shape'?'#c4e8b2':'#cbc3ee'):L.pose?'#c9e0ff':full?'#d4d4d4':'#fff';c.fillRect(x,0,ww,h);c.strokeStyle='#000';c.lineWidth=1;c.strokeRect(x+.5,.5,ww-1,h-1);
        c.beginPath();c.arc(x+FW/2-.5,h-5.5,2.5,0,Math.PI*2);if(full){c.fillStyle='#000';c.fill()}else{c.fillStyle='#fff';c.fill();c.stroke()}
        if(tw&&end>k){const ok=tweenValid(L,k),y=h-5.5;c.beginPath();c.setLineDash(ok?[]:[2,2]);c.moveTo(x+FW,y);c.lineTo(x+ww-2,y);c.stroke();c.setLineDash([]);
          if(ok){c.beginPath();c.moveTo(x+ww-2,y);c.lineTo(x+ww-6,y-3);c.lineTo(x+ww-6,y+3);c.closePath();c.fillStyle='#000';c.fill()}}   // tween arrow (dashed when broken)
        else if(end>k){c.fillStyle='#fff';c.fillRect(x+ww-FW+1,h-9,FW-3,7);c.strokeRect(x+ww-FW+1.5,h-8.5,FW-4,6)}
        if(L.labels&&L.labels[k]){c.fillStyle='#d00';c.fillRect(x+2,2,1,8);c.beginPath();c.moveTo(x+3,2);c.lineTo(x+8,4);c.lineTo(x+3,6);c.fill();
          if(ww>FW*2){c.fillStyle='#000';c.font='9px '+getComputedStyle(document.body).fontFamily;c.fillText(L.labels[k],x+10,9,ww-12)}}
      });
      if(L.poses)Object.keys(L.poses).map(Number).filter(k=>k<=L.len).forEach(k=>{const cx=(k-1)*FW+FW/2-.5,cy=h-5.5;c.beginPath();c.moveTo(cx,cy-3.5);c.lineTo(cx+3,cy);c.lineTo(cx,cy+3.5);c.lineTo(cx-3,cy);c.closePath();c.fillStyle='#000';c.fill()});
    }
    const R=d.fsel&&S.frameSel?fselRange():null,multi=R&&(R.l0!==R.l1||R.f0!==R.f1);
    if(i===d.curLayer){c.fillStyle='rgba(0,0,0,.08)';c.fillRect(0,0,w,h)}
    c.fillStyle='rgba(40,40,40,.45)';if(multi){if(i>=R.l0&&i<=R.l1)c.fillRect((R.f0-1)*FW,0,(R.f1-R.f0+1)*FW-1,h)}else if(i===d.curLayer)c.fillRect((d.frame-1)*FW,0,FW-1,h)
  });
  applyTLScroll();
}
function updatePlayhead(){
  const d=S.doc,ph=$('#playhead');if(!d||!ph)return;const x=(d.frame-1)*FW-(S.tlScroll||0),fr=$('#frameRows');
  ph.style.left=x+'px';ph.style.display=x<-FW||(fr&&x>fr.clientWidth)?'none':'';
  const mk=$('#onionMk'),O=S.onion;if(mk){const show=O.on||O.outline||O.always||O.multi;mk.style.display=show?'':'none';
    if(show){const b=O.all?d.frame-1:Math.min(O.before,d.frame-1),a=O.all?maxLen()-d.frame:O.after;mk.style.left=((d.frame-1-b)*FW)+'px';mk.style.width=(Math.max(0,a+b+1)*FW)+'px'}}
  $('#tlCur').textContent=d.frame;$('#tlFps').textContent=d.fps.toFixed(1)+'fps';$('#tlEl').textContent=((d.frame-1)/d.fps).toFixed(1)+'s';
}
function gotoFrame(f){const d=S.doc;if(!d)return;d.fsel=null;f=Math.max(1,Math.min(FRAMES,f));if(f===d.frame){updatePlayhead();return}
  closeText();penEnd();commitFrame();d.frame=f;d.sel.clear();subSel=null;loadFrame();scrollTLTo(f);
  renderStage();drawFrames();if(!playing)renderPI()}
let playing=null;
function stopPlay(){if(playing){clearInterval(playing);playing=null;renderStage();renderPI()}}
function play(){const d=S.doc;if(!d)return;if(playing){stopPlay();return}
  const end=maxLen();if(end<=1)return;if(d.frame>=end)gotoFrame(1);
  playing=setInterval(()=>{if(S.doc!==d){stopPlay();return}let n=d.frame+1;if(n>end){if(S.checks['Loop Playback'])n=1;else{stopPlay();return}}gotoFrame(n)},1000/d.fps)}
// timeline horizontal scrolling (frames are FW px wide; the view scrolls to keep the playhead visible)
function scrollTLTo(f){const fr=$('#frameRows');if(!fr)return;const x=(f-1)*FW,vis=fr.clientWidth;if(x<S.tlScroll||x>S.tlScroll+vis-FW)S.tlScroll=Math.max(0,x-vis/3)}
function applyTLScroll(){const fr=$('#frameRows');if(!fr||!S.doc)return;S.tlScroll=Math.max(0,Math.min(FRAMES*FW-fr.clientWidth,S.tlScroll||0));
  fr.querySelectorAll('canvas').forEach(c=>c.style.left=(-S.tlScroll)+'px');const ri=$('#rulerIn');if(ri)ri.style.transform=`translateX(${-S.tlScroll}px)`;updatePlayhead()}
function frameMenu(e){closeMenus();const A=(t,k)=>({t,always:true,act:()=>frameOp(k)});
  const m=buildMenu([A('Insert Frame','frame'),A('Remove Frames','remove'),{t:'-'},A('Insert Keyframe','key'),A('Insert Blank Keyframe','blank'),A('Clear Keyframe','clearkey'),{t:'-'},A('Convert to Keyframes','key'),A('Convert to Blank Keyframes','blank'),{t:'-'},{t:'Create Classic Tween',always:true,act:()=>setTween('classic')},{t:'Create Shape Tween',always:true,act:()=>setTween('shape')},{t:'Remove Tween',always:true,act:()=>setTween(null)},{t:'-'},{t:'Cut Frames'},{t:'Copy Frames'},{t:'Paste Frames'},{t:'Clear Frames'},{t:'Select All Frames'},{t:'-'},{t:'Reverse Frames'}],e.clientX,e.clientY,0);
  menuStack.push(m);document.body.appendChild(m);fitMenu(m)}
// onion skin: neighbouring keyframes of visible, unlocked layers, fading with distance
function onionSVG(){const d=S.doc,O=S.onion;let o='';
  d.layers.forEach(L=>{if(!L.visible||L.locked||L.folder)return;const seen=new Set([keyAt(L,d.frame),...(L._ld||[])]);
    const side=(dir,n)=>{for(let j=1;j<=n;j++){const f=d.frame+dir*j;if(f<1||f>L.len)break;const k=keyAt(L,f);if(k===null||seen.has(k))continue;seen.add(k);
      o+=`<g opacity="${(.5*(1-(j-1)/Math.max(n,1))+.08).toFixed(2)}" pointer-events="none">${L.frames[k].map(s=>shapeSVG(s,O.outline?L.color:null,true)).join('')}</g>`}};
    side(-1,O.all?FRAMES:O.before);side(1,O.all?FRAMES:O.after)});
  return o}

/* ================= keyboard ================= */
const KEY_CMDS=['Cut Frames','Copy Frames','Paste Frames','Clear Frames','Select All Frames','Lock','Unlock All','Distribute to Layers','Bold','Italic',
  'Align Left','Align Center','Align Right','Justify','Increase','Decrease','Reset','Outlines','Fast','Anti-Alias','Anti-Alias Text','Show Grid','Snap to Grid','Edit Grid...','Print...'];
function chordOf(e){const c=e.code,k=/^Key[A-Z]$/.test(c)?c.slice(3):/^Digit\d$/.test(c)?c.slice(5):{ArrowLeft:'←',ArrowRight:'→',ArrowUp:'↑',ArrowDown:'↓',Quote:"'",Backspace:'⌫'}[c];
  return k?(e.altKey?'⌥':'')+(e.shiftKey?'⇧':'')+(e.metaKey||e.ctrlKey?'⌘':'')+k:null}
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,select,[contenteditable=true]'))return;
  const k=e.key;const mod=e.metaKey||e.ctrlKey;
  if(k===' '&&S.doc&&!mod){e.preventDefault();if(!spaceHand){spaceHand=true;setCursor()}return}
  if(k==='Escape'){closeMenus();closeFly();closeSwatch();penEnd();if(lassoPts){lassoPts=null;renderStage()}return}
  // the chords of the newer commands come from the CS4 shortcut table (e.code, since Option changes e.key on a Mac)
  if(mod||e.altKey){const ch=chordOf(e),cmd=ch&&KEY_CMDS.find(t=>SHORTCUTS[t]===ch);if(cmd){if(menuEnabled(cmd)){e.preventDefault();runCommand(cmd)}return}}
  if(mod){const map={z:e.shiftKey?'Redo':'Undo',y:'Redo',a:e.shiftKey?'Deselect All':'Select All',d:'Duplicate',j:'Document...',l:'Library',x:'Cut',c:'Copy',v:e.shiftKey?'Paste in Place':'Paste in Center',g:e.shiftKey?'Ungroup':'Group',b:'Break Apart',e:'Edit Symbols',s:e.shiftKey?'Save As...':'Save',o:'Open...'};
    if(k==='Enter'){e.preventDefault();runCommand('Test Movie');return}
    if(k==='='||k==='+'){e.preventDefault();runCommand('Zoom In');return}if(k==='-'){e.preventDefault();runCommand('Zoom Out');return}
    if(k==='1'){e.preventDefault();runCommand('100%');return}
    const c=map[k.toLowerCase()];if(c&&menuEnabled(c)){e.preventDefault();runCommand(c)}return}
  if(k.startsWith('Arrow')&&S.doc&&S.doc.sel.size){e.preventDefault();const n=e.shiftKey?10:1;nudge(k==='ArrowLeft'?-n:k==='ArrowRight'?n:0,k==='ArrowUp'?-n:k==='ArrowDown'?n:0);return}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();delSel();return}
  if(k==='F5'){e.preventDefault();e.shiftKey?removeFrame():insertFrame('frame');return}
  if(k==='F6'){e.preventDefault();e.shiftKey?frameOp('clearkey'):insertFrame('key');return}
  if(k==='F7'){e.preventDefault();insertFrame('blank');return}
  if(k==='F8'){e.preventDefault();convertToSymbol();return}
  if(k==='F4'){e.preventDefault();runCommand('Hide Panels');return}
  if(k==='Enter'){if(pen){penEnd();return}runCommand('Play');return}
  if(k==='.'){runCommand('Step Forward One Frame');return}if(k===','){runCommand('Step Backward One Frame');return}
  if(k.length===1&&!e.altKey){const K=k.toUpperCase();
    for(const g of TOOLS){if(g.sep)continue;const all=[g,...(g.subs||[])].map(x=>toolDef(x.name));const m=all.filter(t=>t.key===K);
      if(m.length){const curIdx=m.findIndex(t=>t.name===S.tool);selectTool(m[(curIdx+1)%m.length].name);return}}}
});
addEventListener('keyup',e=>{if(e.key===' '&&spaceHand){spaceHand=false;setCursor()}});
addEventListener('resize',()=>{renderStage();placeSplitters()});

(function restorePrefs(){const p=loadPrefs();S.userWS=p.user&&typeof p.user==='object'?p.user:{};S.wsName='Essentials';
  const known=n=>WS_PRESETS[n]||S.userWS[n];if(p.name&&known(p.name))S.wsName=p.name;
  setWS(p.cur&&typeof p.cur==='object'?p.cur:known(S.wsName));S.brush.zoomWith=!!p.brushZoom;S.eraser.zoomWith=!!p.eraserZoom})();
// application bar: CS4 puts a Search Help field beside the workspace switcher
$('#appbar').insertAdjacentHTML('beforeend',`<div class="abSep"></div><div id="helpSearch">${IMG.searchIcon?`<img src="${IMG.searchIcon}" alt="">`:''}<input placeholder="Search Help" aria-label="Search Help" spellcheck="false"></div>`);
$('#helpSearch input').addEventListener('keydown',e=>e.stopPropagation());
renderMenubar();render();

</script>
